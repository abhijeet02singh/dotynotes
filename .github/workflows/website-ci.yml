name: Website CI

on:
  push:
    branches:
      - master
    paths:
      - 'dotynotes-website/**'
      - '.github/workflows/website-ci.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'dotynotes-website/**'
      - '.github/workflows/website-ci.yml'

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotynotes-website

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: dotynotes-website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint codebase
        run: npm run lint

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Run automated tests
        run: npm test

      - name: Build production bundle
        run: npm run build
